name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret নেই। Settings > Secrets and variables > Actions এ যোগ করুন।"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pvc=${{ github.run_number }} --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   out/SaveKoro-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/SaveKoro-armv7.apk
          cp app/build/outputs/apk/release/app-universal-release.apk   out/SaveKoro-universal.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SaveKoro v1.0.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            ## 📥 কোনটা ডাউনলোড করবেন?
            - **SaveKoro-arm64.apk**: বেশিরভাগ ফোনের জন্য (প্রস্তাবিত)
            - **SaveKoro-armv7.apk**: পুরনো/কম দামি ফোনের জন্য
            - **SaveKoro-universal.apk**: সব ফোনে চলে, কিন্তু সাইজ বড়

            ইনস্টলের সময় "অজানা উৎস থেকে ইনস্টল" অনুমতি দিন।

            Facebook, YouTube, Instagram, TikTok, Pinterest আর Threads থেকে ভিডিও/MP3 ডাউনলোড করুন।
            শুধু নিজের বা অনুমতি আছে এমন কনটেন্ট ডাউনলোড করুন।
